<!doctype html><html><head><meta charset="utf-8"><title>BWB Savant card</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
*{box-sizing:border-box;margin:0}
html,body{width:1080px;height:1350px;background:#070f1f}
html.sq,html.sq body{height:1080px} html.st,html.st body{height:1920px}
.card{position:relative;width:1080px;height:100%;overflow:hidden;color:#fff;font-family:"IBM Plex Sans",Arial,sans-serif;
  background:radial-gradient(90% 70% at 50% 34%,#1d3a70 0%,#0e2145 46%,#070f1f 100%)}
.card::before{content:"";position:absolute;left:0;right:0;top:0;height:14px;background:linear-gradient(90deg,#3b62b0,#c9cdd6 50%,#d22d49)}
.top{position:absolute;top:58px;left:64px;right:64px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:18px}
.brand img{height:84px;width:auto;display:block}
.brand span{font-family:"Oswald",sans-serif;font-weight:600;font-size:30px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.85)}
.live{font-family:"Oswald",sans-serif;font-weight:600;font-size:28px;letter-spacing:.16em;text-transform:uppercase;background:#d22d49;padding:10px 24px;border-radius:6px}
.logo{position:absolute;left:0;right:0;top:170px;display:flex;justify-content:center;filter:drop-shadow(0 26px 46px rgba(0,0,0,.5))}
.logo svg{width:530px;height:530px;display:block}
.title{position:absolute;left:0;right:0;top:738px;text-align:center}
.title h1{font-family:"Oswald",sans-serif;font-weight:700;font-size:176px;line-height:1;letter-spacing:.01em}
.bar{width:420px;height:10px;border-radius:5px;margin:22px auto 26px;background:linear-gradient(90deg,#3b62b0,#c9cdd6 50%,#d22d49)}
.title p{font-size:42px;line-height:1.3;color:rgba(255,255,255,.88);max-width:820px;margin:0 auto}
.chips{position:absolute;left:64px;right:64px;bottom:148px;display:flex;flex-wrap:wrap;justify-content:center;gap:14px}
.chips span{font-family:"Oswald",sans-serif;font-weight:500;font-size:28px;letter-spacing:.1em;text-transform:uppercase;padding:10px 24px;border:2px solid rgba(255,255,255,.4);border-radius:999px;color:#fff}
.foot{position:absolute;left:0;right:0;bottom:52px;text-align:center;font-family:"Oswald",sans-serif;font-weight:500;font-size:34px;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.75)}
.foot b{color:#fff;font-weight:700}

/* square (1080x1080) and story (1080x1920) versions: add ?f=sq or ?f=st to the URL */
.sq .top{top:46px}.sq .brand img{height:70px}.sq .brand span{font-size:26px}
.sq .logo{top:128px}.sq .logo svg{width:390px;height:390px}
.sq .title{top:540px}.sq .title h1{font-size:150px}.sq .bar{margin:16px auto 20px;width:360px;height:9px}.sq .title p{font-size:36px}

<div class="card">

  <div class="logo" id="logo"></div>
  <div class="title"><h1>BWB Savant</h1><div class="bar"></div><p>The league’s home for advanced statistics</p></div>
  <div class="chips"><span>Percentile rankings</span><span>Pizza charts</span><span>Team playstyle maps</span><span>League trends</span><span>Park factors</span></div>
  <div class="foot"><b>bwbwiffleball.com</b></div>
</div>
<script>
function svColor(p){
  const t = Math.max(0,Math.min(100,p))/100;
  const blue=[59,98,176], grey=[201,205,214], red=[210,45,73];
  const mix=(a,b,u)=>a.map((x,i)=>Math.round(x+(b[i]-x)*u));
  const c = t<0.5 ? mix(blue,grey,t*2) : mix(grey,red,(t-0.5)*2);
  return `rgb(${c[0]},${c[1]},${c[2]})`;
}
function savantLogoSVG(size){
  const PCT = [98,16,90,8,96,24,86,4], n = PCT.length, step = 2*Math.PI/n, cx = 50, cy = 50, BR = 33, RMAX = 48.5;
  const pt = (a,r) => [cx+r*Math.cos(a), cy+r*Math.sin(a)];
  const wedge = (i,r) => { const a0 = -Math.PI/2+i*step, a1 = a0+step, [x0,y0] = pt(a0,r), [x1,y1] = pt(a1,r);
    return `M${cx},${cy}L${x0.toFixed(2)},${y0.toFixed(2)}A${r.toFixed(2)},${r.toFixed(2)} 0 0 1 ${x1.toFixed(2)},${y1.toFixed(2)}Z`; };
  const wedges = PCT.map((p,i)=>`<path d="${wedge(i, BR + 4.5 + (RMAX-BR-4.5)*p/100)}" fill="${svColor(p)}" stroke="#0b1a33" stroke-width="1.3" stroke-linejoin="round"/>`).join('');
  /* the five slots are traced from a photo of a real wiffleball (outlines, not pills): each one is curved and tapers, because the ball is
     round. A white lip sits under each, and a soft shadow runs along the upper edge. */

79.27,40.36C79.30,40.89 79.51,41.44 79.71,42.03C79.92,42.61 80.19,43.25 80.49,43.87C80.79,44.49 81.16,45.13 81.49,45.76C81.83,46.40 82.15,47.19 82.50,47.66C82.85,48.12 83.41,48.70 83.61,48.55C83.82,48.40 83.78,47.53 83.72,46.77C83.67,46.01 83.54,44.91 83.28,43.98C83.02,43.05 82.55,41.98 82.16,41.19C81.77,40.40 81.27,39.68 80.94,39.24C80.60,38.80 80.40,38.64 80.16,38.57C79.92,38.51 79.64,38.55 79.49,38.85Z"];
  const holes = SLOT_PATHS.map(d=>`<path d="${d}" fill="#ffffff" stroke="#ffffff" stroke-width="2" stroke-linejoin="round"/>
    <path d="${d}" fill="url(#svlgHole)"/>
    <path d="${d}" fill="none" stroke="url(#svlgLip)" stroke-width="1.3" stroke-linejoin="round"/>`).join('');
  return `<svg class="svlogo" viewBox="0 0 100 100" width="${size}" height="${size}" role="img" aria-label="Savant">
    <defs>
      <radialGradient id="svlgBall" cx="38%" cy="34%" r="72%"><stop offset="0" stop-color="#ffffff"/><stop offset=".62" stop-color="#e9ecf2"/><stop offset="1" stop-color="#b8c0cf"/></radialGradient>
      <linearGradient id="svlgHole" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8d96ab"/><stop offset=".55" stop-color="#bfc6d3"/><stop offset="1" stop-color="#dde1e9"/></linearGradient>
      <linearGradient id="svlgLip" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4a5572"/><stop offset=".5" stop-color="#4a5572" stop-opacity=".25"/><stop offset="1" stop-color="#4a5572" stop-opacity="0"/></linearGradient>
      <clipPath id="svlgClip"><circle cx="50" cy="50" r="${BR}"/></clipPath>
    </defs>
    ${wedges}
    <circle cx="50" cy="50" r="${BR+1.3}" fill="#0b1a33"/>
    <circle cx="50" cy="50" r="${BR}" fill="url(#svlgBall)"/>
    <g clip-path="url(#svlgClip)">${holes}</g>
    <ellipse cx="40" cy="31" rx="10" ry="5.4" fill="#fff" opacity=".4" transform="rotate(-30 40 31)"/>
  </svg>`;
}
const F = new URLSearchParams(location.search).get('f');
if(F==='sq'||F==='st') document.documentElement.classList.add(F);
document.getElementById('logo').innerHTML = savantLogoSVG(600);
</script></body></html>
